name: Image scan

# Scans the engine image for HIGH and CRITICAL vulnerabilities in the base
# image and the shipped binary. Runs on a schedule rather than per pull
# request so a newly published advisory reports here instead of failing
# unrelated pull requests; a finding fails the run.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Container Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: goerp-engine:${{ github.sha }}
          outputs: type=docker,dest=/tmp/goerp-engine.tar

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          input: /tmp/goerp-engine.tar
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
