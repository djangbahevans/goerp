name: Engine CI

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      engine: ${{ steps.filter.outputs.engine }}
      cli: ${{ steps.filter.outputs.cli }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # internal/module is imported by both internal/cli/module (module
      # scaffold/build/package commands) and internal/engine/moduleboot's
      # e2e test, so a change there must trigger both lanes — same
      # reasoning as go.mod/go.sum, which either binary's dependency graph
      # can be affected by.
      - name: Detect Relevant Changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            go:
              - "**/*.go"
              - "go.mod"
              - "go.sum"
              - "Dockerfile"
              - "compose.dev.yml"
              - ".github/workflows/go.yml"
            engine:
              - "internal/engine/**"
              - "internal/module/**"
              - "sdk/go/**"
              - "cmd/engine/**"
              - "go.mod"
              - "go.sum"
              - "Dockerfile"
              - "compose.dev.yml"
              - ".github/workflows/go.yml"
            cli:
              - "internal/cli/**"
              - "internal/module/**"
              - "internal/gateway/**"
              - "cmd/goerp/**"
              - "cmd/admin-gateway/**"
              - "go.mod"
              - "go.sum"
              - ".github/workflows/go.yml"

  # Lint, a full-repo build check, and govulncheck are all cheap and need
  # no dev stack — run once whenever either lane would run, rather than
  # duplicating them in both build-and-test jobs below.
  lint-and-vulncheck:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: true

      - name: Verify Dependencies
        run: go mod download && go mod verify

      - name: Run Linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13

      - name: Build Everything
        run: go build ./...

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # internal/engine/**, internal/module/**, sdk/go/**, cmd/engine/** —
  # the engine binary and everything it imports. Needs the full
  # compose.dev.yml stack (Postgres/Redis/Meilisearch/SeaweedFS) and is
  # the slow lane; a PR that only touches CLI code never pays this cost.
  engine-build-test:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: true

      - name: Verify Dependencies
        run: go mod download && go mod verify

      - name: Build Engine Binary
        run: CGO_ENABLED=0 go build -o engine ./cmd/engine

      - name: Build goerp CLI Binary
        run: CGO_ENABLED=0 go build -o goerp ./cmd/goerp

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Container Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: goerp-engine:${{ github.sha }}
          outputs: type=docker,dest=/tmp/goerp-engine.tar

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          input: /tmp/goerp-engine.tar
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Start Dev Stack
        run: docker compose -f compose.dev.yml up -d --wait

      # See the identical step in cli-build-test below — this job also
      # runs internal/module's frontend-build tests, so it's exposed to
      # the same cold-npm-cache flakiness (goerp#585).
      - name: Cache npm packages
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('internal/module/build_test.go') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Run Engine Tests
        run: go test -v -race -timeout 30m -coverprofile=coverage-engine.txt -covermode=atomic ./internal/engine/... ./internal/module/... ./sdk/... ./cmd/engine/...

      # Catches module-level regressions the engine tests above don't exercise.
      - name: Run WASM Module Test Suite
        working-directory: sdk/go/modeltest/testdata/fixture
        run: ${{ github.workspace }}/goerp module test --timeout 30m

      - name: Stop Dev Stack
        if: always()
        run: docker compose -f compose.dev.yml down -v

  # internal/cli/**, internal/gateway/**, internal/module/**,
  # cmd/goerp/**, cmd/admin-gateway/** — the goerp CLI and admin-gateway
  # binaries. Neither imports internal/engine (confirmed: no
  # "internal/engine" import anywhere under internal/cli or
  # internal/gateway) and neither package's tests touch Postgres — every
  # admin API interaction is httptest-mocked — so this lane needs no dev
  # stack at all.
  cli-build-test:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: true

      - name: Verify Dependencies
        run: go mod download && go mod verify

      - name: Build CLI Binaries
        run: |
          CGO_ENABLED=0 go build -o goerp ./cmd/goerp
          CGO_ENABLED=0 go build -o admin-gateway ./cmd/admin-gateway

      # internal/module's frontend-build tests run a real `npm install`
      # against a synthetic fixture generated fresh in a temp dir at test
      # time — there's no committed lockfile for actions/setup-node's own
      # npm cache option to key against, so this caches ~/.npm directly.
      # A cold cache still has to fetch vite's full registry metadata
      # (tens of MB — npm's registry API has no way to ask for just one
      # version), which alone can approach these tests' own timeouts; a
      # warm cache serves that from disk instead (goerp#585).
      - name: Cache npm packages
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('internal/module/build_test.go') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Run CLI Tests
        run: go test -v -race -timeout 30m -coverprofile=coverage-cli.txt -covermode=atomic ./internal/cli/... ./internal/gateway/... ./internal/module/... ./cmd/goerp/... ./cmd/admin-gateway/...

  ci-gate:
    needs: [changes, lint-and-vulncheck, engine-build-test, cli-build-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every lane that ran to have passed
        run: |
          fail=0

          if [ "${{ needs.changes.outputs.go }}" = "true" ] && [ "${{ needs.lint-and-vulncheck.result }}" != "success" ]; then
            echo "lint-and-vulncheck did not succeed (result: ${{ needs.lint-and-vulncheck.result }})"
            fail=1
          fi
          if [ "${{ needs.changes.outputs.engine }}" = "true" ] && [ "${{ needs.engine-build-test.result }}" != "success" ]; then
            echo "engine-build-test did not succeed (result: ${{ needs.engine-build-test.result }})"
            fail=1
          fi
          if [ "${{ needs.changes.outputs.cli }}" = "true" ] && [ "${{ needs.cli-build-test.result }}" != "success" ]; then
            echo "cli-build-test did not succeed (result: ${{ needs.cli-build-test.result }})"
            fail=1
          fi

          exit $fail
