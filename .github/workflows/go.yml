name: Engine CI

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  GOERP_TEST_WASM_CACHE: /tmp/goerp-wasm-cache

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      engine: ${{ steps.filter.outputs.engine }}
      cli: ${{ steps.filter.outputs.cli }}
      modules: ${{ steps.filter.outputs.modules }}
      image: ${{ steps.filter.outputs.image }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Detect Relevant Changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            go:
              - "**/*.go"
              - "testdata/**"
              - "go.mod"
              - "go.sum"
              - "scripts/check-sdk-comments.sh"
              - "compose.dev.yml"
              - "docker/seaweedfs/**"
              - ".github/workflows/go.yml"
            engine:
              - "scripts/precompile-wasm/**"
              - "internal/engine/**"
              - "internal/codegen/**"
              - "internal/guestclock/**"
              - "testdata/**"
              - "contract/**"
              - "internal/module/**"
              - "sdk/go/**"
              - "cmd/engine/**"
              - "go.mod"
              - "go.sum"
              - "compose.dev.yml"
              - "docker/seaweedfs/**"
              - ".github/workflows/go.yml"
              - "Makefile"
            cli:
              - "scripts/precompile-wasm/**"
              - "internal/cli/**"
              - "internal/codegen/**"
              - "internal/guestclock/**"
              - "internal/module/**"
              - "internal/gateway/**"
              - "cmd/goerp/**"
              - "cmd/admin-gateway/**"
              - "go.mod"
              - "go.sum"
              - ".github/workflows/go.yml"
              - "Makefile"
            modules:
              - "modules/**"
              - "internal/guestclock/**"
              - "sdk/go/**"
              - "contract/**"
              - "internal/module/**"
              - "go.mod"
              - "go.sum"
              - ".github/workflows/go.yml"

            image:
              - "Dockerfile"
              - ".dockerignore"
              - "shell/**"
              - "cmd/engine/**"
              - "internal/engine/**"
              - "internal/guestclock/**"
              - "contract/**"
              - "sdk/go/**"
              - "go.mod"
              - "go.sum"
              - ".github/workflows/go.yml"
              - ".github/workflows/image-scan.yml"

  lint-and-vulncheck:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: true

      - name: Verify Dependencies
        run: go mod download && go mod verify

      - name: Run Linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      - name: Check Go Comments
        run: |
          go test -race ./scripts/check-go-comments
          ./scripts/check-sdk-comments.sh

      - name: Build Everything
        run: go build ./...

      - name: Build Contract for WASM
        run: GOOS=wasip1 GOARCH=wasm go build ./contract/...

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Build goerp CLI Binary
        run: CGO_ENABLED=0 go build -o goerp ./cmd/goerp

      - name: Check In-Repo Module Schemas Are Regenerated
        run: |
          set -uo pipefail
          workspace="$(pwd)"
          status=0
          while IFS= read -r manifest; do
            dir="$(dirname "$manifest")"
            if [ -f "$dir/schema/schema.go" ]; then
              echo "::group::goerp module generate --check ($dir)"
              if ! (cd "$dir" && "$workspace/goerp" module generate --check); then
                status=1
              fi
              echo "::endgroup::"
            fi
          done < <(find . -name manifest.json -not -path '*/node_modules/*')
          exit "$status"

  image-build-scan:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Container Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: goerp-engine:${{ github.sha }}
          cache-from: type=gha,scope=goerp-engine-image
          cache-to: type=gha,scope=goerp-engine-image,mode=max

      # Inspect the Dockerfile-built executable; base-image scanning runs in image-scan.yml.
      - name: Scan Shipped Engine Binary for Vulnerabilities
        run: |
          container=$(docker create goerp-engine:${{ github.sha }})
          docker cp "$container":/usr/local/bin/engine /tmp/engine-shipped
          docker rm "$container"
          go run golang.org/x/vuln/cmd/govulncheck@latest -mode=binary /tmp/engine-shipped

  engine-build-test:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    env:
      GOERP_TEST_WASM_PRECOMPILER: /tmp/goerp-wasm-precompile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: true

      - name: Verify Dependencies
        run: go mod download && go mod verify

      - name: Build goerp CLI Binary
        run: CGO_ENABLED=0 go build -o goerp ./cmd/goerp

      - name: Start Dev Stack
        run: docker compose -f compose.dev.yml up -d --wait

      - name: Cache npm packages
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('internal/module/build_test.go') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      # internal/codegen type-checks a generated client with the shell's
      # own tsc, and skips that test without the shell's node_modules.
      - name: Install Shell Dependencies
        working-directory: shell
        run: npm ci --no-audit --no-fund

      - name: Cache WASM Compilation
        uses: actions/cache@v6
        with:
          path: ${{ env.GOERP_TEST_WASM_CACHE }}
          key: wasm-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            wasm-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum') }}-

      - name: Build WASM Test Compiler
        run: CGO_ENABLED=0 go build -race=false -o "$GOERP_TEST_WASM_PRECOMPILER" ./scripts/precompile-wasm

      - name: Run WASM Module Test Suite
        working-directory: sdk/go/modeltest/testdata/fixture
        run: ${{ github.workspace }}/goerp module test --timeout 30m

      - name: Run SeaweedFS Storage Tests
        env:
          GOERP_TEST_S3_ENDPOINT: http://localhost:8334
        run: >-
          go test -v -race -timeout 10m
          ./internal/engine/storage ./internal/engine/storageupload ./internal/engine/module
          ./internal/engine/moduleinstall ./internal/engine/tenant/export
          ./internal/engine/tenant/import ./internal/engine/jobqueue
          -run 'TestSeaweedFS|TestServeHTTP_|TestFrontendTranslations_Upload|TestPublishBundleStorage|TestWorker_Run_PublishesFrontendTranslations|TestWorkerRun_|TestTenantTransfer_|TestStorageCleanup'

      - name: Run Engine Tests
        run: make test-engine GO_TEST_FLAGS="-v -race -timeout 30m"

      - name: Stop Dev Stack
        if: always()
        run: docker compose -f compose.dev.yml down -v

  cli-build-test:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    env:
      GOERP_TEST_WASM_PRECOMPILER: /tmp/goerp-wasm-precompile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: true

      - name: Verify Dependencies
        run: go mod download && go mod verify

      - name: Build CLI Binaries
        run: |
          CGO_ENABLED=0 go build -o goerp ./cmd/goerp
          CGO_ENABLED=0 go build -o admin-gateway ./cmd/admin-gateway

      # Synthetic frontend fixtures have no committed lockfile for setup-node's cache key.
      - name: Cache npm packages
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('internal/module/build_test.go') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache WASM Compilation
        uses: actions/cache@v6
        with:
          path: ${{ env.GOERP_TEST_WASM_CACHE }}
          key: wasm-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            wasm-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum') }}-

      - name: Build WASM Test Compiler
        run: CGO_ENABLED=0 go build -race=false -o "$GOERP_TEST_WASM_PRECOMPILER" ./scripts/precompile-wasm

      - name: Run CLI Tests
        run: make test-cli GO_TEST_FLAGS="-v -race -timeout 30m"

  module-build-test:
    needs: changes
    if: needs.changes.outputs.modules == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: true

      - name: Verify Dependencies
        run: go mod download && go mod verify

      - name: Build goerp CLI Binary
        run: CGO_ENABLED=0 go build -o goerp ./cmd/goerp

      - name: Cache npm packages
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-modules-${{ hashFiles('modules/*/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-modules-

      - name: Start Dev Stack
        run: docker compose -f compose.dev.yml up -d --wait

      - name: Cache WASM Compilation
        uses: actions/cache@v6
        with:
          path: ${{ env.GOERP_TEST_WASM_CACHE }}
          key: wasm-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            wasm-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum') }}-

      - name: Build and Test Modules
        run: |
          set -uo pipefail
          workspace="$(pwd)"
          status=0
          while IFS= read -r manifest; do
            dir="$(dirname "$manifest")"
            echo "::group::goerp module build + test ($dir)"
            if ! (cd "$dir" && "$workspace/goerp" module build . --output "$RUNNER_TEMP/$(basename "$dir").erp" \
              && "$workspace/goerp" module test --timeout 30m); then
              status=1
            fi
            echo "::endgroup::"
          done < <(find modules -mindepth 2 -maxdepth 2 -name manifest.json | sort)
          exit "$status"

      - name: Stop Dev Stack
        if: always()
        run: docker compose -f compose.dev.yml down -v

  ci-gate:
    needs: [changes, lint-and-vulncheck, image-build-scan, engine-build-test, cli-build-test, module-build-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every lane that ran to have passed
        run: |
          fail=0

          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "changes did not succeed (result: ${{ needs.changes.result }})"
            fail=1
          fi
          if [ "${{ needs.changes.outputs.image }}" = "true" ] && [ "${{ needs.image-build-scan.result }}" != "success" ]; then
            echo "image-build-scan did not succeed (result: ${{ needs.image-build-scan.result }})"
            fail=1
          fi
          if [ "${{ needs.changes.outputs.go }}" = "true" ] && [ "${{ needs.lint-and-vulncheck.result }}" != "success" ]; then
            echo "lint-and-vulncheck did not succeed (result: ${{ needs.lint-and-vulncheck.result }})"
            fail=1
          fi
          if [ "${{ needs.changes.outputs.engine }}" = "true" ] && [ "${{ needs.engine-build-test.result }}" != "success" ]; then
            echo "engine-build-test did not succeed (result: ${{ needs.engine-build-test.result }})"
            fail=1
          fi
          if [ "${{ needs.changes.outputs.cli }}" = "true" ] && [ "${{ needs.cli-build-test.result }}" != "success" ]; then
            echo "cli-build-test did not succeed (result: ${{ needs.cli-build-test.result }})"
            fail=1
          fi

          if [ "${{ needs.changes.outputs.modules }}" = "true" ] && [ "${{ needs.module-build-test.result }}" != "success" ]; then
            echo "module-build-test did not succeed (result: ${{ needs.module-build-test.result }})"
            fail=1
          fi

          exit $fail
