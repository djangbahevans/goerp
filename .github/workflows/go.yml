name: Engine CI

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Detect Relevant Changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            go:
              - "**/*.go"
              - "go.mod"
              - "go.sum"
              - "Dockerfile"
              - "compose.dev.yml"
              - ".github/workflows/go.yml"

  build-and-test:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true

      - name: Verify Dependencies
        run: go mod download && go mod verify

      - name: Run Linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12

      # Build, govulncheck, and the Trivy image scan all run before the
      # dev-stack test suite below (the ~10+ minute step) so a security or
      # build failure fails the job quickly instead of only surfacing
      # after the full test run completes.
      - name: Build Engine Binary
        run: CGO_ENABLED=0 go build -o engine ./cmd/engine

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Container Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: goerp-engine:${{ github.sha }}
          outputs: type=docker,dest=/tmp/goerp-engine.tar

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: /tmp/goerp-engine.tar
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Start Dev Stack
        run: docker compose -f compose.dev.yml up -d --wait

      - name: Run Tests
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Stop Dev Stack
        if: always()
        run: docker compose -f compose.dev.yml down -v

  ci-gate:
    needs: [changes, build-and-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require build-and-test to have passed when it ran
        run: |
          if [ "${{ needs.changes.outputs.go }}" = "true" ] && [ "${{ needs.build-and-test.result }}" != "success" ]; then
            echo "build-and-test did not succeed (result: ${{ needs.build-and-test.result }})"
            exit 1
          fi
