name: Unblock issues

on:
  issues:
    types: [closed]

permissions:
  issues: write

jobs:
  unblock:
    runs-on: ubuntu-latest
    steps:
      - name: Remove blocked label from issues whose dependencies are all closed
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const closedNumber = context.payload.issue.number;

            const { repository } = await github.graphql(
              `query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $number) {
                    blocking(first: 50) { nodes { number } }
                  }
                }
              }`,
              { owner, repo, number: closedNumber }
            );

            for (const dependent of repository.issue.blocking.nodes) {
              const result = await github.graphql(
                `query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    issue(number: $number) {
                      labels(first: 50) { nodes { name } }
                      blockedBy(first: 50) { nodes { number state } }
                    }
                  }
                }`,
                { owner, repo, number: dependent.number }
              );
              const issue = result.repository.issue;

              const hasBlockedLabel = issue.labels.nodes.some((l) => l.name === "blocked");
              if (!hasBlockedLabel) continue;

              const stillBlocked = issue.blockedBy.nodes.some((b) => b.state !== "CLOSED");
              if (stillBlocked) continue;

              console.log(`Removing 'blocked' label from #${dependent.number}`);
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number: dependent.number,
                name: "blocked",
              });
            }
