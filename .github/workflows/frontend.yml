name: Frontend CI

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Detect Relevant Changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - "shell/**"
              - "internal/engine/shellassets/**"
              - "testdata/**"
              - "**/frontend/**"
              - ".github/workflows/frontend.yml"

  build-and-typecheck:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: shell/package-lock.json

      - name: Install Dependencies
        working-directory: shell
        run: npm install

      - name: Lint
        working-directory: shell
        run: npm run lint

      - name: Typecheck
        working-directory: shell
        run: npm run typecheck

      - name: Test
        working-directory: shell
        run: npm run test

      - name: Build
        working-directory: shell
        run: npm run build

      - name: Setup Go for Module Runtime Tests
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"

      - name: Install Chromium
        working-directory: shell
        run: npx playwright install --with-deps chromium

      - name: Test Module Runtime
        working-directory: shell
        run: npm run test-module-runtime -w @goerp/shell-app

  storybook-tests:
    needs: changes
    # Disabled while the headless browser crashes mid-run (goerp#1245).
    # Re-enable by restoring: if: needs.changes.outputs.frontend == 'true'
    if: false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: shell/package-lock.json

      - name: Install Dependencies
        working-directory: shell
        run: npm install

      - name: Cache Playwright Browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('shell/package-lock.json') }}

      - name: Install Chromium
        working-directory: shell
        run: npx playwright install --with-deps chromium

      - name: Run Story Tests
        working-directory: shell
        run: npm run test-storybook

  ci-gate:
    needs: [changes, build-and-typecheck, storybook-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every frontend job to have passed when it ran
        run: |
          if [ "${{ needs.changes.outputs.frontend }}" != "true" ]; then
            exit 0
          fi
          # storybook-tests is disabled (goerp#1245); add its result back here when it's re-enabled.
          if [ "${{ needs.build-and-typecheck.result }}" != "success" ]; then
            echo "build-and-typecheck: ${{ needs.build-and-typecheck.result }}"
            exit 1
          fi
