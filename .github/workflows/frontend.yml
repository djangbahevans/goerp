name: Frontend CI

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Detect Relevant Changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - "shell/**"
              - "testdata/**"
              - "**/frontend/**"
              - ".github/workflows/frontend.yml"

  build-and-typecheck:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: shell/package-lock.json

      - name: Install Dependencies
        working-directory: shell
        run: npm install

      - name: Lint
        working-directory: shell
        run: npm run lint

      - name: Typecheck
        working-directory: shell
        run: npm run typecheck

      - name: Test
        working-directory: shell
        run: npm run test

      - name: Build
        working-directory: shell
        run: npm run build

  storybook-tests:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: shell/package-lock.json

      - name: Install Dependencies
        working-directory: shell
        run: npm install

      - name: Cache Playwright Browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('shell/package-lock.json') }}

      - name: Install Chromium
        working-directory: shell
        run: npx playwright install --with-deps chromium

      - name: Run Story Tests
        working-directory: shell
        run: npm run test-storybook

  ci-gate:
    needs: [changes, build-and-typecheck, storybook-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every frontend job to have passed when it ran
        run: |
          if [ "${{ needs.changes.outputs.frontend }}" != "true" ]; then
            exit 0
          fi
          for result in "${{ needs.build-and-typecheck.result }}" "${{ needs.storybook-tests.result }}"; do
            if [ "$result" != "success" ]; then
              echo "build-and-typecheck: ${{ needs.build-and-typecheck.result }}, storybook-tests: ${{ needs.storybook-tests.result }}"
              exit 1
            fi
          done
