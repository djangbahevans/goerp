<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>GoERP</title>
    <!--goerp-import-map-->
  </head>
  <body>
    <div id="root"></div>
    <!-- Resolve theme before React mounts to prevent a flash of the wrong colors. -->
    <script>
      (() => {
        var stored = localStorage.getItem("goerp-theme");
        var theme = stored === "light" || stored === "dark" ? stored : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
        var storedContrast = localStorage.getItem("goerp-contrast");
        var contrast = storedContrast === "standard" || storedContrast === "high" ? storedContrast : (matchMedia("(prefers-contrast: more)").matches ? "high" : "standard");
        document.documentElement.setAttribute("data-contrast", contrast);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
