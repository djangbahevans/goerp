<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.TenantName}}</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#18181b;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;">
<tr><td align="center" style="padding:24px 12px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;background:#ffffff;border-radius:8px;">
<tr><td style="padding:24px 32px;border-bottom:1px solid #e4e4e7;">
{{if .TenantLogoURL}}<img src="{{.TenantLogoURL}}" alt="{{.TenantName}}" height="40" style="display:block;height:40px;max-width:200px;border:0;">{{else}}<strong style="font-size:18px;">{{.TenantName}}</strong>{{end}}
</td></tr>
<tr><td style="padding:32px;font-size:15px;line-height:1.6;">
{{.Content}}
</td></tr>
<tr><td style="padding:16px 32px;border-top:1px solid #e4e4e7;font-size:12px;line-height:1.5;color:#71717a;">
&copy; {{.Year}} {{.TenantName}}<br>
<a href="{{.UnsubscribeURL}}" style="color:#71717a;">Unsubscribe from these emails</a>
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
